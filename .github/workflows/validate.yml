name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.221.4

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Every root JSON file is a preset or this repo's own renovate.json,
      # except release-please's config. --no-global validates them as
      # repository config rather than self-hosted global config.
      - name: Validate Renovate configuration
        run: |
          shopt -s nullglob
          files=()
          for f in *.json; do
            [[ "$f" == release-please-config.json ]] || files+=("$f")
          done
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- \
            renovate-config-validator --strict --no-global "${files[@]}"
